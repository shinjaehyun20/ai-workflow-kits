name: Public safety scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  public-safety-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run public safety scan
        run: python tools/public-safety-scan.py

      - name: Validate context references
        run: python tools/validate-context-paths.py
